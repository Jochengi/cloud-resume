name: Frontend Production Code Deployer

# 1. Trigger this pipeline ONLY when changes are made inside the frontend directory
on:
  push:
    paths:
      - 'frontend/**'
  workflow_dispatch: # Allows manual visual triggers from GitHub dashboard

permissions:
  id-token: write 
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      # Pull down your source files into virtual machine worker shell
      - name: Checkout Code Base
        uses: actions/checkout@v4

      # Authenticate with AWS using OIDC Keycard badge Role
      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::329539068222:role/cloud-resume-github-deployer-v2
          aws-region: us-east-1

      # Spin up Node.js runtime environment to compile React components
      - name: Install Node.js Environment Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Download package assets and compile application into static /dist files
      - name: Compile Production Code Build Package
        run: |
          cd frontend/
          npm ci
          npm run build

      # Deploy and sync static compilation folder straight up to S3
      - name: Sync Build Deliverables to AWS S3 Bucket
        run: |
          aws s3 sync frontend/dist/ s3://jochengi-cloud-resume-bucket --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID}} --paths "/*"
